<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gsap in shadow roots</title>
    <!--
      GSAP animating elements inside web components: three x-tile components (test ids tile-1…3)
      with a dot (motionpr-id dot) in an open shadow root. "play" moves every dot 120px in one
      staggered tween (0.4 s, 0.1 s apart).
    -->
    <style>
      body {
        margin: 0;
        font: 16px sans-serif;
      }
      x-tile {
        display: block;
        width: 200px;
        height: 40px;
        margin: 8px;
      }
    </style>
  </head>
  <body>
    <button data-testid="play">Play</button>
    <x-tile data-testid="tile-1"></x-tile>
    <x-tile data-testid="tile-2"></x-tile>
    <x-tile data-testid="tile-3"></x-tile>
    <script src="/gsap.min.js"></script>
    <script src="/adapter.js"></script>
    <script>
      const { motionprGsap } = MotionprGsap;
      motionprGsap.register(gsap);
      customElements.define(
        "x-tile",
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: "open" }).innerHTML =
              '<div data-motionpr-id="dot" style="width:30px;height:30px;background:#e17055"></div>';
          }
        },
      );
      const dots = [...document.querySelectorAll("x-tile")].map((tile) =>
        tile.shadowRoot.querySelector("[data-motionpr-id=dot]"),
      );
      document.querySelector("[data-testid=play]").addEventListener("click", () => {
        gsap.to(dots, { x: 120, duration: 0.4, stagger: 0.1, ease: "power2.out" });
      });
    </script>
  </body>
</html>
